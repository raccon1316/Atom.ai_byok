<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Welcome to Atom.AI</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0a0913;
      color: #f5f2ff;
      max-width: 640px;
      margin: 60px auto;
      padding: 0 24px;
      text-align: center;
    }
    h1 { font-size: 2rem; margin-bottom: 12px; }
    p { color: #a89fcf; margin-bottom: 24px; }
    .step {
      background: #14121f;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      text-align: left;
    }
    .step-num {
      color: #7c71ff;
      font-weight: 700;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <h1>⚛ Welcome to Atom.AI</h1>
  <p>Research any company in 30 seconds.</p>
  <div class="step">
    <div class="step-num">Step 1</div>
    <div>Go to Settings and add your free
    Groq API key (console.groq.com/keys)</div>
  </div>
  <div class="step">
    <div class="step-num">Step 2</div>
    <div>Open 2-3 competitor websites in tabs</div>
  </div>
  <div class="step">
    <div class="step-num">Step 3</div>
    <div>Click "Compare Open Tabs" for an
    instant battle card</div>
  </div>
</body>
</html>
